[env:cyclone-v1-main]
platform = espressif32
board = featheresp32-s2
framework = arduino
lib_deps = 
	sparkfun/SparkFun u-blox GNSS v3@^3.1.15
	stm32duino/STM32duino LSM6DSV16X@^2.1.1
	jgromes/RadioLib@^7.7.1
